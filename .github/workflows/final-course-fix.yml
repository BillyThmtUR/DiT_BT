name: Correction finale du cours

on:
  push:
    branches:
      - cleanup/humanize-texts
    paths:
      - .github/workflows/final-course-fix.yml

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/humanize-texts
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Corriger le cours
        run: python scripts/final_course_fix.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la compilation
        run: npm run build

      - name: Enregistrer la correction
        run: |
          rm -f scripts/final_course_fix.py .github/workflows/final-course-fix.yml
          git config user.name "BillyThmtUR"
          git config user.email "153058930+BillyThmtUR@users.noreply.github.com"
          git add -A
          git commit -m "Corrige les derniers détails du cours"
          git push origin HEAD:cleanup/humanize-texts
