name: Nettoyage éditorial ponctuel

on:
  push:
    branches:
      - cleanup/humanize-texts
    paths:
      - .github/workflows/humanize-texts.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: cleanup/humanize-texts
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nettoyer les textes
        run: python scripts/humanize_texts.py

      - name: Enregistrer les corrections
        run: |
          git config user.name "BillyThmtUR"
          git config user.email "153058930+BillyThmtUR@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git commit -m "Nettoie et humanise les textes du projet"
          git push origin HEAD:cleanup/humanize-texts
